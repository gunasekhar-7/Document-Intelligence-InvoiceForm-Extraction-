[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence"
version = "0.1.0"
description = "Production-ready Document Intelligence system for automated invoice and form extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "pydantic-extra-types==2.7.0",
    "sqlalchemy==2.0.32",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pgvector==0.2.5",
    "redis==5.0.8",
    "arq==0.23.0",
    "minio==7.2.6",
    "paddleocr==2.8.1",
    "tesseract==0.1.3",
    "pytesseract==0.3.10",
    "opencv-python-headless==4.10.0.84",
    "albumentations==1.4.15",
    "pymupdf==1.23.26",
    "pdf2image==1.17.0",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "transformers==4.43.0",
    "accelerate==0.33.0",
    "datasets==2.20.0",
    "tokenizers==0.19.1",
    "seqeval==1.2.2",
    "onnx==1.16.1",
    "onnxruntime-gpu==1.19.0",
    "mlflow==2.15.0",
    "dvclive==2.11.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "python-multipart==0.0.9",
    "python-magic==0.4.27",
    "structlog==24.1.0",
    "prometheus-client==0.19.0",
    "opentelemetry-api==1.25.0",
    "opentelemetry-sdk==1.25.0",
    "opentelemetry-instrumentation-fastapi==0.44b0",
    "opentelemetry-instrumentation-sqlalchemy==0.44b0",
    "opentelemetry-instrumentation-redis==0.44b0",
    "opentelemetry-instrumentation-httpx==0.44b0",
    "opentelemetry-exporter-otlp==1.25.0",
    "opentelemetry-propagator-b3==1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.0",
    "testcontainers==4.7.0",
    "locust==2.31.0",
    "ruff==0.5.6",
    "mypy==1.11.1",
    "black==24.8.0",
    "pre-commit==3.8.0",
    "ipython==8.26.0",
    "jupyter==1.0.0",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "plotly==5.23.0",
    "streamlit==1.37.1",
]
gpu = [
    "paddlepaddle-gpu==2.5.2.post122",
    "onnxruntime-gpu==1.19.0",
]
cpu = [
    "paddlepaddle==2.5.2",
    "onnxruntime==1.19.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/document-intelligence"
Repository = "https://github.com/yourusername/document-intelligence"
Issues = "https://github.com/yourusername/document-intelligence/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["document_intelligence*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "PTH", "PIE", "PL", "PT", "Q", "RUF", "SIM", "TCH", "TRY", "RET", "ARG", "ASYNC"
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src/document_intelligence"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.alembic]
script_location = "src/document_intelligence/db/migrations"
prepend_sys_path = "."
version_locations = "%(script_location)s/versions"

[tool.dvclive]
dir = "metrics"