apiVersion: v1
kind: Secret
metadata:
  name: {{ include "document-intelligence.fullname" . }}-secrets
  labels:
    {{- include "document-intelligence.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
  minio-access-key: {{ .Values.secrets.minioAccessKey | quote }}
  minio-secret-key: {{ .Values.secrets.minioSecretKey | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  mlflow-s3-endpoint: {{ .Values.secrets.mlflowS3Endpoint | quote }}
  aws-access-key-id: {{ .Values.secrets.awsAccessKeyId | quote }}
  aws-secret-access-key: {{ .Values.secrets.awsSecretAccessKey | quote }}