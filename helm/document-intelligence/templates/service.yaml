apiVersion: v1
kind: Service
metadata:
  name: {{ include "document-intelligence.fullname" . }}-api
  labels:
    {{- include "document-intelligence.labels" . | nindent 4 }}
    component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "document-intelligence.selectorLabels" . | nindent 4 }}
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "document-intelligence.fullname" . }}-worker
  labels:
    {{- include "document-intelligence.labels" . | nindent 4 }}
    component: worker
spec:
  clusterIP: None
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "document-intelligence.selectorLabels" . | nindent 4 }}
    component: worker