{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStore.name }}
  namespace: {{ .Values.externalSecrets.secretStore.namespace }}
spec:
  provider:
    {{- if eq .Values.externalSecrets.backendType "aws" }}
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.aws.region }}
      {{- if .Values.externalSecrets.aws.auth.roleArn }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.create | ternary (include "document-intelligence.serviceAccountName" .) "default" }}
      {{- end }}
    {{- else if eq .Values.externalSecrets.backendType "gcp" }}
    gcpsm:
      projectID: {{ .Values.externalSecrets.gcp.projectId }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.externalSecrets.gcp.clusterLocation }}
          clusterName: {{ .Values.externalSecrets.gcp.clusterName }}
          serviceAccountRef:
            name: {{ .Values.serviceAccount.create | ternary (include "document-intelligence.serviceAccountName" .) "default" }}
    {{- else if eq .Values.externalSecrets.backendType "azure" }}
    azurekv:
      vaultUrl: {{ .Values.externalSecrets.azure.vaultUrl }}
      authType: WorkloadIdentity
      serviceAccountRef:
        name: {{ .Values.serviceAccount.create | ternary (include "document-intelligence.serviceAccountName" .) "default" }}
    {{- else }}
    # Kubernetes provider for testing
    kubernetes:
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
      auth:
        serviceAccount:
          name: {{ .Values.serviceAccount.create | ternary (include "document-intelligence.serviceAccountName" .) "default" }}
    {{- end }}
---
{{- range .Values.externalSecrets.secretRefs }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.externalSecrets.secretStore.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .property }}
        property: {{ .property }}
{{- end }}
{{- end }}