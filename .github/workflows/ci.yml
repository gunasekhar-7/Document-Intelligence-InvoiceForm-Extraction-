name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Run Ruff linting
        run: ruff check src/

      - name: Run Ruff formatting check
        run: ruff format --check src/

      - name: Run MyPy type checking
        run: mypy src/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=document_intelligence --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build-images:
    name: Build Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  evaluate-model:
    name: Evaluate Model
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Download test dataset
        run: |
          # Download test dataset from artifacts or generate
          python -m document_intelligence.data.synthetic.generate --output data/test --count 100 --no-noise

      - name: Run baseline evaluation
        run: |
          python -m document_intelligence.evaluation.metrics \
            --predictions data/test/baseline_predictions.json \
            --ground-truth data/test/ground_truth.json \
            --output evaluation/baseline_report.html \
            --model-name "baseline"

      - name: Run model evaluation
        run: |
          python -m document_intelligence.evaluation.metrics \
            --predictions data/test/model_predictions.json \
            --ground-truth data/test/ground_truth.json \
            --output evaluation/model_report.html \
            --model-name "layoutlmv3" \
            --baseline evaluation/baseline_results.json

      - name: Check evaluation thresholds
        run: |
          python -c "
import json
with open('evaluation/model_results.json') as f:
    results = json.load(f)
overall_f1 = results['overall_metrics']['f1']
print(f'Overall F1: {overall_f1:.4f}')
if overall_f1 < 0.85:
    print('ERROR: Model F1 below threshold (0.85)')
    exit(1)
print('Model meets quality threshold')
"

  deploy-staging:
    name: Deploy to Staging
    needs: [build-images, evaluate-model]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes (staging)
        run: |
          # This would use kubectl/helm to deploy
          echo "Deploying to staging..."
          # helm upgrade --install document-intelligence ./helm/document-intelligence \
          #   --namespace staging \
          #   --set image.tag=${{ github.sha }} \
          #   --set environment=staging

  deploy-production:
    name: Deploy to Production
    needs: [build-images, evaluate-model]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes (production)
        run: |
          # Blue-green deployment
          echo "Deploying to production..."
          # helm upgrade --install document-intelligence ./helm/document-intelligence \
          #   --namespace production \
          #   --set image.tag=${{ github.event.release.tag_name }} \
          #   --set environment=production

  notify:
    name: Notify
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "Pipeline completed"
          # Send Slack/Discord notification